<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jakob Christensen</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111111;
        --fg: #eeeeee;
        --muted: #9a9a9a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111111;
      --fg: #eeeeee;
      --muted: #9a9a9a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <h1>Jakob Christensen</h1>
  <p>Website im Aufbau.</p>
</body>
</html>
